name: Build Sura Engine APK

on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'arena-*'
      - 'codespace-**'
      - 'feature/**'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  GRADLE_VERSION: 8.7
  ANDROID_API_LEVEL: 33
  ANDROID_BUILD_TOOLS: 33.0.2

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install SDK tooling
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Download Android command line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q -O tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          rm -rf tmp latest
          unzip -q tools.zip -d tmp
          mkdir -p latest
          mv tmp/cmdline-tools/* latest/ 2>/dev/null || true
          rm -rf tmp tools.zip

      - name: Configure SDK path
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses & install platform
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null

      - name: Show environment
        run: |
          java -version
          gradle -v
          echo "SDK: $ANDROID_SDK_ROOT"

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-unit.log | tail -60

      - name: Build debug APK
        id: build_debug
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-debug.log | tail -60

      - name: Build release APK (unsigned)
        id: build_release
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-release.log | tail -60

      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Sura Engine build diagnostics"
            echo ""
            for f in /tmp/gradle-unit.log /tmp/gradle-debug.log /tmp/gradle-release.log; do
              if [ ! -f "$f" ]; then continue; fi
              echo "#### $(basename "$f")"
              echo '```'
              grep -E "^(e: |error: |FAILURE:|> Task .* FAILED|Caused by:|\* Try:|Execution failed|A problem occurred)" "$f" | head -80 || true
              echo '--- what went wrong ---'
              grep -A 12 "What went wrong" "$f" | head -40 || true
              echo '--- tail ---'
              tail -25 "$f"
              echo '```'
            done
          } > /tmp/diagnostics.md
          echo "" >> /tmp/diagnostics.md
          echo "#### failing tests" >> /tmp/diagnostics.md
          echo '```' >> /tmp/diagnostics.md
          for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
            if [ -f "$f" ]; then
              grep -o '<testcase name="[^"]*" classname="[^"]*"' "$f" | head -40 >> /tmp/diagnostics.md || true
              grep -A 4 '<failure' "$f" | head -60 >> /tmp/diagnostics.md || true
            fi
          done
          echo '```' >> /tmp/diagnostics.md
          head -c 60000 /tmp/diagnostics.md > /tmp/diagnostics-trimmed.md
          gh api -X POST "repos/$REPO/commits/$SHA/comments" -F body=@/tmp/diagnostics-trimmed.md > /dev/null 2>&1 || echo "diagnostics comment skipped"
          grep -E "^(e: |error: )" /tmp/gradle-unit.log 2>/dev/null | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Verify build result
        if: always()
        run: |
          if [ "${{ steps.unit_tests.outcome }}" != "success" ] || [ "${{ steps.build_debug.outcome }}" != "success" ]; then
            echo "Build or tests failed - see the commit comment 'Sura Engine build diagnostics' for details."
            exit 1
          fi

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} build-artifacts/ \; 2>/dev/null || true
          ls -la build-artifacts || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sura-engine-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sura-engine-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/**/*
          if-no-files-found: ignore

  release:
    name: Publish APK to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
